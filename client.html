<!doctype html>
<html lang="en">
  <head>
    <title>Attorney Online session</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta
      name="description"
      content="An off-the-cuff courtroom drama simulator"
    />
    <meta name="author" content="stonedDiscord" />
    <meta property="og:title" content="Attorney Online" />
    <meta
      property="og:description"
      content="Attorney Online is an online version of the world-renowned courtroom drama simulator that allows you to create and play out cases in an off-the-cuff format."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="http://web.aceattorneyonline.com/" />
    <meta
      property="og:image"
      content="https://repository-images.githubusercontent.com/78860508/89fcba80-aafd-11e9-80db-c5b10c01aba9"
    />

    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Attorney Online" />
    <meta
      property="twitter:description"
      content="Attorney Online is an online version of the world-renowned courtroom drama simulator that allows you to create and play out cases in an off-the-cuff format."
    />
    <meta property="twitter:url" content="http://web.aceattorneyonline.com/" />
    <meta
      property="twitter:image"
      content="https://repository-images.githubusercontent.com/78860508/89fcba80-aafd-11e9-80db-c5b10c01aba9"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="
		script-src-elem 'self' 'unsafe-inline' blob:;
		style-src-elem 'self' 'unsafe-inline' data:;
		script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
		style-src 'self' 'unsafe-inline' data:;
		img-src 'self' data: blob: file: *;
		connect-src 'self' ws: file: *;
		media-src 'self' file: *;"
    />

    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <link rel="apple-touch-icon" href="logo-new.png" />
    <!-- Runtime-swapped stylesheets (client_theme / chatbox_theme /
         nameplate_setting / mod_ui / effect_css) are created in
         src/client-main.ts; their hrefs are set on startup. -->
    <style>
      #client_ooclog {
        text-align: left;
      }

      #client_ooclog a {
        color: white;
      }
    </style>
  </head>

  <body>
    <div
      id="voice_speaker_overlay"
      class="voice-speaker-overlay"
      aria-live="polite"
      aria-label="Voice chat speakers"
    ></div>
    <div id="client_error_overlay" style="display: none">
      <div id="client_error">
        <div id="client_error_icon">&#x26A0;</div>
        <h2 id="client_errortext"></h2>
        <p id="client_error_code">
          Error code: <span id="error_id">(none)</span>
        </p>
        <button id="client_reconnect" data-action="ReconnectButton">
          Reconnect
        </button>
        <p id="client_error_help">
          Having trouble?
          <a href="https://discord.gg/9rYQVVQ" target="_blank">Join us on Discord</a>
        </p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="./src/client-main.ts"></script>
  </body>

  <template id="voice">
    <span
      id="menu_voice"
      data-action="toggleVoice"
      class="menu_button"
      style="display: none"
      title="Toggle voice chat"
    >
      <b class="menu_icon" id="menu_voice_icon">&#128264;</b>
      <div class="menu_text" id="menu_voice_text">Voice</div>
    </span>
    <div
      id="menu_voice_openmic_row"
      style="display: none; text-align: center; font-size: 11px; margin: -6px 15px 4px; white-space: nowrap"
      title="Always transmit when connected — no need to hold V or press Tap to Talk. Useful for mobile users."
    >
      <label style="cursor: pointer">
        <input type="checkbox" id="voice_openmic_check" style="cursor: pointer" />
        Always transmit (no PTT)
      </label>
    </div>
    <fieldset id="voice_settings" style="text-align: left; display: none">
      <legend>&#127908; Voice Chat</legend>
      <div id="voice_status_line" style="margin-bottom: 6px"></div>
      <button
        type="button"
        id="voice_toggle_button"
        class="client_button hover_button"
      >
        Enable Microphone
      </button>
      &nbsp;
      <button
        type="button"
        id="voice_mute_button"
        class="client_button hover_button"
      >
        &#128264; Mute VC Audio
      </button>
      <br />
      <br />
      <span id="voice_ptt_controls" style="display: none">
        <button
          type="button"
          id="voice_tap_button"
          class="client_button hover_button"
          style="min-width: 140px"
        >
          &#127908; Tap to Talk
        </button>
        <span
          id="voice_ptt_hint"
          style="font-size: 11px; opacity: 0.7; margin-left: 6px"
        >
          or hold V
        </span>
        <br />
        <br />
      </span>
      <label for="voice_input_device">Microphone:</label>
      <select id="voice_input_device" name="voice_input_device">
        <option value="">Default</option>
      </select>
      <br />
      <br />
      <label for="voice_output_volume">Voice playback volume:</label>
      <input
        id="voice_output_volume"
        type="range"
        min="0"
        max="1"
        value="1"
        step="0.01"
      />
      <br />
      <br />
      <div
        id="voice_speaking_list"
        style="font-size: 11px; opacity: 0.85"
      ></div>
    </fieldset>
  </template>

</html>
