name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install Dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type Check
        run: bun run typecheck
      - name: Run Tests
        run: bun test
      - name: Build
        run: bun run build
      - name: Deploy
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SSH_PRIVATEKEY: ${{ secrets.SSH_PRIVATEKEY }}
          TARGET: /var/www/webao.miku.pizza/
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATEKEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pinned so the deploy refuses any other machine at that address.
          echo "$SERVER_IP ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAICGYjaiBmS1OtKHgPi51928ebDlME+64Fq0q7c5gZdwz" > ~/.ssh/known_hosts
          ssh="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o LogLevel=ERROR"
          # New assets first, then the pages and service worker that reference them, dropping what the build no longer has.
          rsync -rltz --chmod=D755,F644 -e "$ssh" --exclude '*.html' --exclude 'sw.js' dist/ "ubuntu@$SERVER_IP:$TARGET"
          rsync -rltz --chmod=D755,F644 -e "$ssh" --delete dist/ "ubuntu@$SERVER_IP:$TARGET"
